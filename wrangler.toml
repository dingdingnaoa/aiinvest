# Cloudflare Pages 配置 — AI Invest
#
# 本文件是 Pages 项目的唯一配置源（source of truth）。
# 只要仓库里存在 wrangler.toml，Dashboard 上的「绑定」与「构建配置」就会显示为
# 只读（灰色），这是 Cloudflare 的预期行为，不是故障 —— 要改配置请改本文件并提交。
#
# 发布目录 = dist/。仓库内部文件（db/、scripts/、server.js、sync_data.py、
# wrangler.toml、requirements.txt、README.md、.github/ 等）留在仓库根目录，
# 不进入发布目录，所以任何人都无法通过 HTTP 下载到它们。
#
# functions/ 必须留在仓库根目录（Cloudflare 自行读取），不要复制进 dist/。

name = "aiinvest"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-01"

# D1 绑定 —— 顶层声明，同时作用于 local / 预览 / 生产三个环境。
# 绑定变量名必须是 DB（functions 中通过 env.DB 访问）。
[[d1_databases]]
binding = "DB"
database_name = "aiinvest-db"
database_id = "577bcf83-433f-444f-ae63-6c0f6bca5fec"
